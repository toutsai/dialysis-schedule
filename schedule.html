<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日排程表 (Firebase 穩定版)</title>
    <style>
        :root {
            --primary-color: #007bff; --success-color: #28a745; --danger-color: #dc3545;
            --border-color: #dee2e6; --sidebar-bg: #f8f9fa; --green-bg: #e8f5e9;
            --hepatitis-bg: #fffde7; --hepatitis-border: #fff176;
            --blue-bg: #e3f2fd; --red-bg: #ffcdd2;
        }
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1800px; margin: 0 auto; }
        .header-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .date-navigator { display: flex; align-items: center; gap: 10px; }
        .date-navigator button, .main-actions button { border: 1px solid #ccc; border-radius: 5px; padding: 8px 12px; font-size: 1em; cursor: pointer; background-color: #fff; }
        #current-date-display { font-size: 1.5em; font-weight: bold; color: #333; }
        #weekday-display { font-size: 1.2em; color: #005a9c; margin-left: 5px;}
        #save-btn { background-color: var(--success-color); color: white; }
        #save-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #print-btn { background-color: #008CBA; color: white; border-color: #008CBA;}
        #clear-all-btn { background-color: #f44336; color: white; border-color: #f44336;}
        .status-indicator { font-weight: bold; margin-left: auto; }
        .main-container { display: flex; gap: 20px; }
        .schedule-content { flex-grow: 1; }
        .dialysis-unit { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; }
        .aisle { writing-mode: vertical-lr; text-align: center; padding: 20px; background-color: #dcdcdc; border-radius: 8px; font-size: 1.5em; letter-spacing: 0.5em; display: flex; align-items: center; justify-content: center; }
        .left-wing, .right-wing { display: flex; flex-direction: column; gap: 10px; }
        .bed-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bed, .nursing-station, .peripheral-bed { border: 1px solid #ccc; border-radius: 5px; overflow: hidden; background-color: #fff; }
        .bed-header { background-color: #e3f2fd; color: #0d47a1; font-weight: bold; padding: 5px; text-align: center; }
        .bed.hepatitis .bed-header { background-color: var(--hepatitis-bg); color: #af8203; }
        .shift-row, .peripheral-shift-row { display: grid; align-items: stretch; border-top: 1px solid #e0e0e0; position: relative; }
        .shift-row { grid-template-columns: 28px 70px 1fr 40px; }
        .peripheral-shift-row { grid-template-columns: 28px 70px 70px 1fr 40px; border-top-color: #f8bbd0; }
        .shift-label { background-color: #f5f5f5; font-size: 0.8em; font-weight: bold; display: flex; align-items: center; justify-content: center; border-right: 1px solid #e0e0e0; }
        .nurse-team-select { padding: 4px; border: none; font-size: 0.8em; width: 100%; background: transparent; border-radius: 0; text-align: center; }
        .shift-row > .nurse-team-select, .peripheral-shift-row > .nurse-team-select { border-right: 1px solid #e0e0e0; }
        .patient-cell { flex-grow: 1; min-height: 40px; display: flex; justify-content: center; align-items: center; text-align: center; cursor: pointer; }
        .patient-cell.filled { font-weight: bold; }
        .patient-cell.filled:hover { background-color: #d1ecf1; }
        .patient-cell:not(.filled):hover { background-color: #e2e6ea; }
        .patient-cell.dragging { opacity: 0.5; background: #e2e6ea; }
        .patient-cell.drag-over { transform: scale(1.02); background-color: #c8e6c9; }
        .patient-name { padding: 4px; border-radius: 4px; }
        .patient-name.status-opd { background-color: var(--green-bg); }
        .patient-name.status-ipd { background-color: var(--red-bg); }
        .patient-tag { border-left: 1px solid #e0e0e0; min-width: 40px; }
        .inpatient-sidebar { width: 280px; flex-shrink: 0; background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; display: flex; flex-direction: column; }
        .sidebar-section { margin-bottom: 15px; }
        .sidebar-section h3 { margin-top: 0; text-align: center; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; margin-bottom: 10px; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .filter-group button { padding: 4px 8px; font-size: 0.8em; flex-grow: 1; }
        .filter-group button.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        #inpatient-list, #nurse-stats-list { list-style-type: none; padding: 0; margin: 0; overflow-y: auto; }
        #inpatient-list { max-height: 35vh; }
        #nurse-stats-list { max-height: 35vh; }
        #inpatient-list li { background-color: #fff; border: 1px solid #e0e0e0; padding: 8px; margin-bottom: 5px; border-radius: 5px; cursor: grab; }
        #inpatient-list li:active { cursor: grabbing; }
        #inpatient-list li.scheduled-inpatient { background-color: #fff59d; border-left: 5px solid var(--primary-color); }
        .patient-info-row { display: flex; justify-content: space-between; align-items: center; }
        #inpatient-list li .name { font-weight: bold; }
        #inpatient-list li .freq { font-size: 0.9em; color: #555; }
        #nurse-stats-list li { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #eee; }
        .team-name { font-weight: bold; }
        .team-counts { display: flex; gap: 8px; align-items: center; }
        .count-badge { padding: 2px 8px; border-radius: 10px; color: white; font-size: 0.9em; }
        .count-total { background-color: #6c757d; }
        .count-ipd { background-color: var(--danger-color); }
        .count-opd { background-color: var(--success-color); }
        .shift-row.has-memo, .peripheral-shift-row.has-memo { outline: 3px solid var(--danger-color); outline-offset: -3px; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-controls">
            <div class="date-navigator">
                <button id="prev-date-btn" class="date-nav-btn"><</button>
                <div>
                    <h1 id="current-date-display"></h1>
                    <div id="weekday-display"></div>
                </div>
                <button id="next-date-btn" class="date-nav-btn">></button>
                <button id="today-btn">回到今日</button>
            </div>
            <div class="main-actions">
                <span id="status-indicator" class="status-indicator"></span>
                <button id="save-btn" disabled>儲存變更</button>
                <button id="print-btn">列印排程</button>
                <button id="clear-all-btn">清空本日畫面</button>
            </div>
        </div>
        <div class="main-container">
            <div class="schedule-content">
                <div class="dialysis-unit">
                    <div class="left-wing" id="left-wing"></div>
                    <div class="aisle">中 央 走 道</div>
                    <div class="right-wing" id="right-wing"></div>
                </div>
                <div class="extra-sections">
                    <div class="peripheral-section">
                        <h2>外圍床位</h2>
                        <div class="peripheral-bed-container" id="peripheral-bed-container"></div>
                    </div>
                </div>
            </div>
            <aside class="inpatient-sidebar">
                <div class="sidebar-section">
                    <h3>住院病人 (可拖曳)</h3>
                    <div class="filter-group" id="filter-group">
                        <button data-filter="all" class="active">全部</button>
                        <button data-filter="135">一三五</button>
                        <button data-filter="246">二四六</button>
                    </div>
                    <ul id="inpatient-list"></ul>
                </div>
                <div class="sidebar-section">
                    <h3>護理師分組統計</h3>
                    <ul id="nurse-stats-list"></ul>
                </div>
            </aside>
        </div>
    </div>
    
    <script src="api_manager.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {

        function initializeSchedulePage() {
            const patientsApi = ApiManager('patients');
            const schedulesApi = ApiManager('schedules');
            const memosApi = ApiManager('memos');

            let currentDate = new Date();
            let currentRecord = null;
            let allPatients = [];
            let hasUnsavedChanges = false;
            let inpatientFilter = 'all';

            const statusIndicator = document.getElementById('status-indicator');
            const saveBtn = document.getElementById('save-btn');
            const baseTeams = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', '外圍'];
            const nurseOptionsHTML = `<option value=""></option>` + 
                                     baseTeams.map(t => `<optgroup label="${t}組">
                                        <option value="早${t}">早${t}</option>
                                        <option value="晚${t}">晚${t}</option>
                                     </optgroup>`).join('');
            const layoutData = { leftWingRows: [['空', 32, 31], [33, 35, 36], [39, 38, 37], [51, 52, 53], [57, 56, 55], [58, 59, 61], [65, 63, 62]], rightWingRows: [[29, 28, 27], [23, 25, 26], [22, 21, 19], [16, 17, 18], [15, 13, 12], [8, 9, 11], [7, 6, 5], [1, 2, 3]] };
            const aisleSideBeds = [1, 7, 8, 15, 16, 22, 23, 29, 31, 36, 37, 53, 55, 61, 62, 65];
            const hepatitisBeds = ['空', 31, 32, 33, 35, 36];
            const peripheralBedCount = 6;
            
            const formatDate = (date) => { const year = date.getFullYear(); const month = (date.getMonth() + 1).toString().padStart(2, '0'); const day = date.getDate().toString().padStart(2, '0'); return `${year}-${month}-${day}`; };
            const setStatus = (message, type) => { statusIndicator.textContent = message; statusIndicator.className = `status-indicator ${type}`; };
            const printSchedule = () => window.print();

            function createPeripheralBedElement(index) {
                const bedDiv = document.createElement('div'); bedDiv.className = 'peripheral-bed';
                const shiftRowsHTML = ['早', '午', '晚'].map(shift => {
                    return `<div class="peripheral-shift-row" data-shift-id="peripheral-${index}-${shift}"><div class="shift-label">${shift}</div><select class="nurse-team-select">${nurseOptionsHTML}</select><div class="peripheral-bed-number" contenteditable="true"></div><div class="patient-cell" draggable="false"></div><div class="patient-tag" contenteditable="true"></div></div>`;
                }).join('');
                bedDiv.innerHTML = `<div class="peripheral-header">外圍床位 ${index}</div>${shiftRowsHTML}`; return bedDiv;
            }
            
            function createBedElement(bedNumber, isHepatitis, isAisleSide, wingClass) {
                if (bedNumber === '空') { const p = document.createElement('div'); p.className = 'bed placeholder'; p.innerHTML = '<div class="bed-header">未排床</div>'; return p; }
                const bedDiv = document.createElement('div'); bedDiv.className = `bed ${wingClass}`; bedDiv.dataset.bedId = `bed-${bedNumber}`; if (isAisleSide) bedDiv.classList.add('aisle-side'); if (isHepatitis) bedDiv.classList.add('hepatitis'); let headerText = `床號 ${bedNumber}`; if (isHepatitis) headerText += ' (BC肝炎)';
                const shiftRowsHTML = ['早', '午', '晚'].map(shift => { const shiftId = `bed-${bedNumber}-${shift}班`; return `<div class="shift-row" data-shift-id="${shiftId}"><div class="shift-label">${shift}</div><select class="nurse-team-select">${nurseOptionsHTML}</select><div class="patient-cell" draggable="false"></div><div class="patient-tag" contenteditable="true"></div></div>`; }).join('');
                bedDiv.innerHTML = `<div class="bed-header">${headerText}</div>${shiftRowsHTML}`; return bedDiv;
            }
            
            function generateWingLayout(container, rows, wingClass) { container.innerHTML = ''; rows.forEach(rowBeds => { const rowDiv = document.createElement('div'); rowDiv.className = 'bed-row'; rowBeds.forEach(bedNumber => { rowDiv.appendChild(createBedElement(bedNumber, hepatitisBeds.includes(bedNumber), aisleSideBeds.includes(bedNumber), wingClass)); }); container.appendChild(rowDiv); }); }

            function generateLayout() {
                const leftWing = document.getElementById('left-wing'); const rightWing = document.getElementById('right-wing'); const peripheralContainer = document.getElementById('peripheral-bed-container');
                generateWingLayout(leftWing, layoutData.leftWingRows, 'left-wing-bed');
                generateWingLayout(rightWing, layoutData.rightWingRows, 'right-wing-bed');
                const n = document.createElement('div'); n.className = 'bed-row'; n.innerHTML = '<div class="nursing-station" style="grid-column: 1 / -1; text-align: center; padding: 20px; background-color: #e9ecef;">護理站</div>'; rightWing.insertBefore(n, rightWing.firstChild);
                peripheralContainer.innerHTML = ''; for (let i = 1; i <= peripheralBedCount; i++) { peripheralContainer.appendChild(createPeripheralBedElement(i)); }
            }

            function clearBoardUi() {
                document.querySelectorAll('.nurse-team-select').forEach(s => { s.value = ''; s.title=''; });
                document.querySelectorAll('div[contenteditable="true"]').forEach(d => d.textContent = '');
                document.querySelectorAll('.patient-cell').forEach(cell => { cell.innerHTML = ''; cell.classList.remove('filled'); cell.draggable = false; delete cell.dataset.patientId; });
                document.querySelectorAll('.has-memo').forEach(el => el.classList.remove('has-memo'));
                updateNurseStats();
            }

            const updateShiftPatientCount = () => {
                // This function seems to have been removed or was incomplete. 
                // We'll re-implement a simple version.
                const shifts = ['早班', '午班', '晚班'];
                shifts.forEach(shift => {
                    const count = document.querySelectorAll(`.patient-cell.filled[data-shift-id*="-${shift}"]`).length;
                    // Assuming there are elements to display these counts, e.g., <span id="early-shift-count"></span>
                    // For now, we'll just log it.
                    console.log(`${shift}人數: ${count}`);
                });
                renderInpatientList();
            };
            
            function updatePatientCellStyle(patientNameEl) {
                if (!patientNameEl || !patientNameEl.textContent) return;
                const patientName = patientNameEl.textContent.trim();
                const patient = allPatients.find(p => p.name === patientName);
                patientNameEl.className = 'patient-name';
                if (!patient) return;
                if (patient.status === 'ipd') { patientNameEl.classList.add('status-ipd'); } 
                else { patientNameEl.classList.add('status-opd'); }
            }
            
            async function loadDataForDay(dateStr) {
                hasUnsavedChanges = false;
                updateSaveButtonState();
                currentRecord = null;
                clearBoardUi();
                setStatus('讀取中...', 'loading');
                
                try {
                    const { where } = window.firebase.firestore;
                    const [patients, dailyRecords, memos] = await Promise.all([
                        patientsApi.fetchAll(),
                        schedulesApi.fetchAll([where("date", "==", dateStr)]),
                        memosApi.fetchAll([where("isResolved", "==", false)])
                    ]);

                    allPatients = patients.filter(p => !p.isDeleted);
                    currentRecord = dailyRecords.length > 0 ? dailyRecords[0] : null;

                    if (currentRecord) {
                        renderDataToUI(currentRecord.schedule || {});
                        setStatus('資料已從雲端載入', 'saved');
                    } else {
                        setStatus(`本日無排班記錄`, 'saved');
                    }
                    updateShiftPatientCount();
                    updateNurseStats();
                    showMemoReminders(memos);

                } catch (error) {
                    console.error('載入資料失敗:', error);
                    setStatus('讀取失敗', 'error');
                    clearBoardUi();
                }
            }

            function isPatientScheduledToday(patientId) {
                for(const cell of document.querySelectorAll('.patient-cell')) {
                    if(cell.dataset.patientId === patientId) return true;
                }
                return false;
            }

            function renderInpatientList() {
                const inpatientListEl = document.getElementById('inpatient-list');
                if (!inpatientListEl) return;
                let inpatients = allPatients.filter(p => p.status === 'ipd' && !p.isDeleted);
                const filterGroup = document.getElementById('filter-group');
                const activeFilter = filterGroup.querySelector('.active').dataset.filter;
                const regularFreqs = ['一三五', '二四六'];
                if (activeFilter === '135') { inpatients = inpatients.filter(p => p.frequency === '一三五');
                } else if (activeFilter === '246') { inpatients = inpatients.filter(p => p.frequency === '二四六');
                }
                
                inpatientListEl.innerHTML = '';
                if (inpatients.length === 0) {
                    inpatientListEl.innerHTML = '<li>無符合條件的住院病人</li>';
                } else {
                    inpatients.forEach(p => {
                        const li = document.createElement('li');
                        li.draggable = true;
                        li.dataset.patientId = p.id;
                        if (isPatientScheduledToday(p.id)) { li.classList.add('scheduled-inpatient'); }
                        li.innerHTML = `
                            <div class="patient-info-row"><span class="name">${p.name}</span><span class="freq">${p.frequency || '未設定'}</span></div>
                            <div class="patient-info-row"><span class="mrn">(${p.medicalRecordNumber || '無病歷號'})</span></div>`;
                        inpatientListEl.appendChild(li);
                    });
                }
            }

            function renderDataToUI(scheduleData) {
                const patientMap = new Map(allPatients.map(p => [p.id, p]));
                Object.entries(scheduleData).forEach(([shiftId, data]) => { 
                    const row = document.querySelector(`[data-shift-id="${shiftId}"]`); 
                    if (!row) return; 
                    const patient = patientMap.get(data.patientId);
                    const patientCell = row.querySelector('.patient-cell');
                    if (patientCell && patient) {
                        patientCell.innerHTML = `<span class="patient-name">${patient.name}</span>`;
                        patientCell.dataset.patientId = patient.id;
                        patientCell.classList.add('filled');
                        patientCell.draggable = true;
                        updatePatientCellStyle(patientCell.querySelector('.patient-name'));
                    }
                    const bedNumberCell = row.querySelector('.peripheral-bed-number');
                    if (bedNumberCell) { bedNumberCell.textContent = data.bedNumber || ''; }
                    const tagCell = row.querySelector('.patient-tag');
                    if (tagCell) { tagCell.textContent = data.tag || ''; }
                    const nurseSelect = row.querySelector('.nurse-team-select');
                    if(nurseSelect) nurseSelect.value = data.nurse || '';
                });
            }

            function collectDataFromUI() {
                const scheduleData = {};
                document.querySelectorAll('.shift-row, .peripheral-shift-row').forEach(row => {
                    const id = row.dataset.shiftId;
                    const patientId = row.querySelector('.patient-cell').dataset.patientId;
                    if (patientId) {
                        const tag = row.querySelector('.patient-tag')?.textContent || '';
                        let data = { patientId, tag, shiftId: id };
                        data.nurse = row.querySelector('.nurse-team-select').value;
                        if (row.classList.contains('peripheral-shift-row')) {
                            data.bedNumber = row.querySelector('.peripheral-bed-number').textContent;
                        }
                        scheduleData[id] = data;
                    }
                });
                return scheduleData;
            }

            async function saveDataToCloud() {
                saveBtn.disabled = true;
                setStatus('儲存中...', 'loading');
                
                const scheduleData = collectDataFromUI();

                try {
                    if (Object.keys(scheduleData).length === 0) {
                        if (currentRecord) {
                            await schedulesApi.delete(currentRecord.id);
                            currentRecord = null;
                        }
                    } else {
                        const dataToSave = {
                            date: formatDate(currentDate),
                            schedule: scheduleData,
                            names: currentRecord?.names || {}
                        };
                        if (currentRecord) {
                            currentRecord = await schedulesApi.update(currentRecord.id, dataToSave);
                        } else {
                            currentRecord = await schedulesApi.save(dataToSave);
                        }
                    }
                    hasUnsavedChanges = false;
                    setStatus('儲存成功！', 'saved');
                    updateSaveButtonState();
                } catch (error) {
                    console.error("儲存失敗:", error);
                    setStatus('儲存失敗', 'error');
                    saveBtn.disabled = false;
                }
            }
            
            function handleSlotUpdate(shiftId, patientId) {
                const row = document.querySelector(`[data-shift-id="${shiftId}"]`);
                if (!row) return;
                const patientCell = row.querySelector('.patient-cell');
                if (patientId) {
                    const patient = allPatients.find(p => p.id === patientId);
                    if (patient) {
                        patientCell.innerHTML = `<span class="patient-name">${patient.name}</span>`;
                        patientCell.dataset.patientId = patient.id;
                        patientCell.classList.add('filled');
                        patientCell.draggable = true;
                        updatePatientCellStyle(patientCell.querySelector('.patient-name'));
                    }
                } else {
                    patientCell.innerHTML = '';
                    delete patientCell.dataset.patientId;
                    patientCell.classList.remove('filled');
                    patientCell.draggable = false;
                    updatePatientCellStyle(patientCell);
                }
                setChange();
                updateShiftPatientCount();
                updateNurseStats();
            }

            function setupDragAndDrop() {
                const mainContainer = document.querySelector('.main-container');
                let draggedElement = null;
                mainContainer.addEventListener('dragstart', e => {
                    const item = e.target.closest('[draggable="true"]');
                    if (!item) return;
                    draggedElement = item;
                    e.dataTransfer.setData('text/plain', item.dataset.patientId);
                    e.dataTransfer.effectAllowed = 'copyMove';
                    setTimeout(() => item.style.opacity = '0.5', 0);
                });
                mainContainer.addEventListener('dragend', () => {
                    if (draggedElement) {
                        draggedElement.style.opacity = '1';
                    }
                    draggedElement = null;
                });
                mainContainer.addEventListener('dragover', e => {
                    e.preventDefault();
                    const targetCell = e.target.closest('.patient-cell');
                    if (targetCell) {
                        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                        targetCell.classList.add('drag-over');
                    }
                });
                mainContainer.addEventListener('dragleave', e => {
                    e.target.closest('.patient-cell')?.classList.remove('drag-over');
                });
                mainContainer.addEventListener('drop', e => {
                    e.preventDefault();
                    const targetCell = e.target.closest('.patient-cell');
                    if (!targetCell || !draggedElement) return;
                    targetCell.classList.remove('drag-over');
                    const sourcePatientId = e.dataTransfer.getData('text/plain');
                    const targetPatientId = targetCell.dataset.patientId;
                    const sourceIsSchedule = draggedElement.matches('.patient-cell');
                    const targetShiftId = targetCell.closest('.shift-row, .peripheral-shift-row').dataset.shiftId;
                    if (sourceIsSchedule) {
                        const sourceShiftId = draggedElement.closest('.shift-row, .peripheral-shift-row').dataset.shiftId;
                        if (sourceShiftId === targetShiftId) return;
                        if (targetPatientId) {
                            if (confirm(`確定要將 ${draggedElement.textContent.trim()} 與 ${targetCell.textContent.trim()} 交換位置嗎？`)) {
                                handleSlotUpdate(sourceShiftId, targetPatientId);
                                handleSlotUpdate(targetShiftId, sourcePatientId);
                            }
                        } else {
                            handleSlotUpdate(targetShiftId, sourcePatientId);
                            handleSlotUpdate(sourceShiftId, null);
                        }
                    } else {
                        if (targetPatientId) {
                            alert("此床位已有排班，請先清除或拖曳至空格。");
                            return;
                        }
                        handleSlotUpdate(targetShiftId, sourcePatientId);
                    }
                });
            }

            function showMemoReminders(memos) {
                if (!memos || memos.length === 0) return;
                const todayStr = formatDate(currentDate);
                const dateSpecificMemos = memos.filter(m => m.targetDate === todayStr);
                if (dateSpecificMemos.length > 0) {
                    let message = `【本日特別事項提醒 - ${todayStr}】\n\n`;
                    dateSpecificMemos.forEach(memo => { message += `- ${memo.content}\n`; });
                    setTimeout(() => alert(message), 500);
                }
                const patientMemos = memos.filter(m => m.patientName);
                if (patientMemos.length === 0) return;
                document.querySelectorAll('.patient-name').forEach(cell => {
                    const patientName = cell.textContent.trim();
                    if (patientName) {
                        const relatedMemos = patientMemos.filter(m => m.patientName === patientName);
                        if (relatedMemos.length > 0) {
                            const row = cell.closest('.shift-row, .peripheral-shift-row');
                            row.classList.add('has-memo');
                            row.title = relatedMemos.map(m => `備忘: ${m.content}`).join('\n');
                        }
                    }
                });
            }
            
            function updateDateDisplay() {
                const dateStr = formatDate(currentDate);
                document.getElementById('current-date-display').textContent = dateStr;
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                document.getElementById('weekday-display').textContent = weekdays[currentDate.getDay()];
            }
            
            function changeDate(days) {
                if (hasUnsavedChanges && !confirm('您有未儲存的變更，確定要切換日期嗎？所有變更將會遺失。')) return;
                currentDate.setDate(currentDate.getDate() + days);
                updateDateDisplay();
                loadDataForDay(formatDate(currentDate));
            }

            function updateSaveButtonState() {
                saveBtn.disabled = !hasUnsavedChanges;
            }

            function setChange() {
                hasUnsavedChanges = true;
                saveBtn.disabled = false;
                statusIndicator.textContent = '有未儲存的變更';
            }
            
            function updateNurseStats() {
                const statsList = document.getElementById('nurse-stats-list');
                const patientMap = new Map(allPatients.map(p => [p.id, p]));
                const counts = {};

                document.querySelectorAll('.shift-row, .peripheral-shift-row').forEach(row => {
                    const nurse = row.querySelector('.nurse-team-select').value;
                    const patientId = row.querySelector('.patient-cell').dataset.patientId;

                    if (nurse && patientId) {
                        if (!counts[nurse]) {
                            counts[nurse] = { total: 0, ipd: 0, opd: 0 };
                        }
                        counts[nurse].total++;
                        const patient = patientMap.get(patientId);
                        if (patient) {
                            if (patient.status === 'ipd') {
                                counts[nurse].ipd++;
                            } else {
                                counts[nurse].opd++;
                            }
                        }
                    }
                });
                
                statsList.innerHTML = Object.entries(counts)
                    .sort((a,b) => a[0].localeCompare(b[0], 'zh-Hant'))
                    .map(([team, data]) => `
                        <li>
                            <span class="team-name">${team}組</span>
                            <div class="team-counts">
                                <span class="count-ipd" title="住院">住: ${data.ipd}</span>
                                <span class="count-opd" title="門診">門: ${data.opd}</span>
                                <span class="count-total" title="總計">共: ${data.total}</span>
                            </div>
                        </li>
                    `).join('');
            }

            function setupEventListeners() {
                document.getElementById('prev-date-btn').addEventListener('click', () => changeDate(-1));
                document.getElementById('next-date-btn').addEventListener('click', () => changeDate(1));
                document.getElementById('today-btn').addEventListener('click', () => { if (hasUnsavedChanges && !confirm('您有未儲存的變更，確定要切換日期嗎？')) return; currentDate = new Date(); updateDateDisplay(); loadDataForDay(formatDate(currentDate)); });
                saveBtn.addEventListener('click', saveDataToCloud);
                document.getElementById('print-btn').addEventListener('click', printSchedule);
                document.getElementById('clear-all-btn').addEventListener('click', () => { if (confirm('確定要清空本日所有排班嗎？此操作需儲存後才會生效。')) { clearBoardUi(); setChange(); } });
                
                document.querySelector('.main-container').addEventListener('input', (e) => {
                    if (e.target.matches('.nurse-team-select, .patient-tag, .peripheral-bed-number')) {
                        setChange();
                    }
                    if (e.target.matches('.nurse-team-select')) {
                        updateNurseStats();
                    }
                });

                document.querySelector('.main-container').addEventListener('click', e => {
                    const targetCell = e.target.closest('.patient-cell');
                    if (targetCell && targetCell.classList.contains('filled')) {
                        if (confirm('確定要清除此床位的排班嗎？')) {
                            const shiftId = targetCell.closest('[data-shift-id]').dataset.shiftId;
                            handleSlotUpdate(shiftId, null);
                        }
                    }
                });

                const filterGroup = document.getElementById('filter-group');
                filterGroup.addEventListener('click', (e) => {
                    if (e.target.tagName === 'BUTTON') {
                        filterGroup.querySelector('.active').classList.remove('active');
                        e.target.classList.add('active');
                        inpatientFilter = e.target.dataset.filter;
                        renderInpatientList();
                    }
                });
            }
            
            async function initialize() {
                generateLayout();
                updateDateDisplay();
                setupEventListeners();
                setupDragAndDrop();
                await loadDataForDay(formatDate(currentDate));
            }

            initialize();
        }

        function waitForFirebase(callback) {
            if (window.parent && window.parent.db && window.parent.firebase) {
                window.db = window.parent.db;
                window.firebase = window.parent.firebase;
                callback();
            } else {
                console.log(location.pathname.split('/').pop() + " is waiting for Firebase...");
                setTimeout(() => waitForFirebase(callback), 100);
            }
        }

        waitForFirebase(initializeSchedulePage);
    });
    </script>
</body>
</html>
