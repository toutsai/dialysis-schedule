<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血液透析綜合管理平台 (Firebase 最終版)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow: hidden; 
        }
        .dashboard-container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: width 0.3s;
        }
        .sidebar-header {
            padding: 0 20px 20px 20px;
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #34495e;
            white-space: nowrap;
        }
        .sidebar-nav {
            list-style: none;
            padding: 20px 0;
            margin: 0;
            flex-grow: 1;
        }
        .sidebar-nav li a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 1.1em;
            transition: background-color 0.2s, padding-left 0.2s;
            white-space: nowrap;
        }
        .sidebar-nav li a:hover {
            background-color: #34495e;
        }
        .sidebar-nav li a.active {
            background-color: #1abc9c;
            color: white;
            font-weight: bold;
            padding-left: 25px;
        }
        .content-area {
            flex-grow: 1;
            overflow: hidden;
        }
        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                管理平台
            </div>
            <ul class="sidebar-nav">
                <li><a href="schedule.html" class="nav-link active" target="content-iframe">每日排程表</a></li>
                <li><a href="stats.html" class="nav-link" target="content-iframe">護理分組檢視</a></li>
                <li><a href="patients.html" class="nav-link" target="content-iframe">病人管理系統</a></li>
                <li><a href="weekly_view.html" class="nav-link" target="content-iframe">週排班總表</a></li>
                <li><a href="base_schedule.html" class="nav-link" target="content-iframe">常規門診設定</a></li>
                <li><a href="memo.html" class="nav-link" target="content-iframe">交班備忘錄</a></li>
            </ul>
        </aside>
        <main class="content-area">
            <iframe name="content-iframe" class="content-iframe" src="schedule.html"></iframe>
        </main>
    </div>

    <!-- Firebase 初始化和全域工具箱準備 -->
    <script type="module">
      // Import the functions you need from the SDKs you need
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
      
      // 我們需要所有會用到的 Firestore 工具函式，所以在這裡一次性 import
      import { 
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        query,
        where
      } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
    
      // Your web app's Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyAqO8PzTVP8ARrcSBJqMGrU0svGgRuzHCU",
        authDomain: "dialysis-schedule-cd36c.firebaseapp.com",
        projectId: "dialysis-schedule-cd36c",
        storageBucket: "dialysis-schedule-cd36c.firebasestorage.app",
        messagingSenderId: "788045577134",
        appId: "1:788045577134:web:442ad7e7e59f4e3fdf263f"
      };
    
      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      
      // 將 db 實例和所有工具函式都放到全域 window 物件上
      // 這樣所有子頁面和 script 都能取用到它們
      window.db = getFirestore(app);
      window.firebase = {
        firestore: {
          collection,
          getDocs,
          addDoc,
          updateDoc,
          deleteDoc,
          doc,
          query,
          where
        }
      };
    </script>
    
    <!-- index.html 自身的業務邏輯，最終修正版 -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.sidebar-nav .nav-link');
        const iframe = document.querySelector('.content-iframe');

        // Helper functions
        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(new Date(d.setDate(diff)).setHours(0, 0, 0, 0));
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function systemInitializer() {
            console.log("系統初始化啟動 (Firebase 版)...");
            
            // 關鍵修正：我們需要從 iframe 的 contentWindow 去檢查 ApiManager
            if (!iframe.contentWindow || typeof iframe.contentWindow.ApiManager === 'undefined') {
                console.log("ApiManager not ready in iframe, retrying systemInitializer soon...");
                setTimeout(systemInitializer, 200); // 稍後重試
                return;
            }

            // 從 iframe 的 window 中取得 ApiManager
            const ApiManager = iframe.contentWindow.ApiManager;

            const schedulesApi = ApiManager('schedules');
            const baseSchedulesApi = ApiManager('base_schedules');
            const memosApi = ApiManager('memos');

            await preGenerateSchedules(schedulesApi, baseSchedulesApi);
            await showGlobalMemos(memosApi);
            console.log("系統初始化完成。");
        }

        async function preGenerateSchedules(schedulesApi, baseSchedulesApi) {
            console.log("開始檢查並預生成排班...");
            try {
                const baseTemplates = await baseSchedulesApi.fetchAll();
                
                const baseTemplatesByDay = {};
                for (let i = 0; i < 6; i++) { baseTemplatesByDay[i] = {}; }

                baseTemplates.forEach(record => {
                    const { bedNumber, shiftIndex, dayIndex, patientId } = record;
                    const shiftName = ['早班', '午班', '晚班'][shiftIndex];
                    const dailyShiftId = `bed-${bedNumber}-${shiftName}`;
                    if (baseTemplatesByDay[dayIndex] !== undefined) {
                        baseTemplatesByDay[dayIndex][dailyShiftId] = { patientId, shiftId: dailyShiftId };
                    }
                });

                const thisWeekStart = getStartOfWeek(new Date());
                const nextWeekStart = new Date(thisWeekStart);
                nextWeekStart.setDate(nextWeekStart.getDate() + 7);
                
                const datesToCheck = [];
                [thisWeekStart, nextWeekStart].forEach(weekStart => {
                    for (let i = 0; i < 6; i++) {
                        const targetDate = new Date(weekStart);
                        targetDate.setDate(weekStart.getDate() + i);
                        datesToCheck.push(formatDate(targetDate));
                    }
                });

                const existingSchedules = await schedulesApi.fetchAll();
                const existingDates = new Set(existingSchedules.map(rec => rec.date));
                const datesToCreate = datesToCheck.filter(date => !existingDates.has(date));

                if (datesToCreate.length === 0) {
                    console.log("本週與下週的排班皆已存在，無需生成。");
                    return;
                }

                console.log(`準備為以下日期生成排班: ${datesToCreate.join(', ')}`);
                
                for (const dateStr of datesToCreate) {
                    const date = new Date(dateStr + "T00:00:00");
                    const dayIndex = date.getDay() === 0 ? 6 : date.getDay() - 1;
                    
                    if (dayIndex >= 0 && dayIndex < 6) {
                        const templateForThisDay = baseTemplatesByDay[dayIndex];
                        if (templateForThisDay && Object.keys(templateForThisDay).length > 0) {
                            const newRecord = { date: dateStr, schedule: templateForThisDay, names: {} };
                            await schedulesApi.save(newRecord);
                            console.log(`已成功使用週${dayIndex+1}範本生成 ${dateStr} 的排班記錄。`);
                        } else {
                             console.log(`週${dayIndex+1} 的常規範本為空，不為 ${dateStr} 生成記錄。`);
                        }
                    }
                }
            } catch (error) {
                console.error("預生成排班時發生錯誤:", error);
            }
        }
        
        async function showGlobalMemos(memosApi) {
            console.log("正在檢查全域備忘...");
            try {
                const { where } = window.firebase.firestore;
                const memos = await memosApi.fetchAll([where("isResolved", "==", false)]);
                const globalMemos = memos.filter(m => !m.patientName && !m.targetDate);
                
                if (globalMemos.length > 0) {
                    let message = "【全域交班事項提醒】\n\n";
                    globalMemos.forEach(memo => { message += `- ${memo.content}\n`; });
                    setTimeout(() => alert(message), 500);
                }
            } catch (error) {
                console.error("獲取全域備忘時發生錯誤:", error);
            }
        }

        // 監聽 iframe 的載入事件，這是觸發初始化的最佳時機
        iframe.addEventListener('load', () => {
            console.log(`Iframe with src "${iframe.contentWindow.location.href}" has loaded. Attempting to start system initializer.`);
            systemInitializer();
        });

        // 導航邏輯
        window.navigateTo = function(pageUrl) {
            if (iframe.contentWindow.location.href.endsWith(pageUrl)) return;
            iframe.src = pageUrl;
        };
        
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                e.currentTarget.classList.add('active');
                window.navigateTo(e.currentTarget.href);
            });
        });
    });
    </script>
</body>
</html>
