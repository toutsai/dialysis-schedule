<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血液透析綜合管理平台</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow: hidden; 
        }
        .dashboard-container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: width 0.3s;
        }
        .sidebar-header {
            padding: 0 20px 20px 20px;
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #34495e;
            white-space: nowrap;
        }
        .sidebar-nav {
            list-style: none;
            padding: 20px 0;
            margin: 0;
            flex-grow: 1;
        }
        .sidebar-nav li a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 1.1em;
            transition: background-color 0.2s, padding-left 0.2s;
            white-space: nowrap;
        }
        .sidebar-nav li a:hover {
            background-color: #34495e;
        }
        .sidebar-nav li a.active {
            background-color: #1abc9c;
            color: white;
            font-weight: bold;
            padding-left: 25px;
        }
        .content-area {
            flex-grow: 1;
            overflow: hidden;
        }
        .content-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                管理平台
            </div>
            <ul class="sidebar-nav">
                <li><a href="weekly_view.html" class="nav-link" target="content-iframe">週排班總表</a></li>
                <li><a href="schedule.html" class="nav-link active" target="content-iframe">每日排程表</a></li>
                <li><a href="stats.html" class="nav-link" target="content-iframe">護理分組檢視</a></li>
                <li><a href="patients.html" class="nav-link" target="content-iframe">病人管理系統</a></li>
                <li><a href="base_schedule.html" class="nav-link" target="content-iframe">常規門診床位表</a></li>
                <li><a href="memo.html" class="nav-link" target="content-iframe">交班備忘錄</a></li>
            </ul>
        </aside>
        <main class="content-area">
            <iframe name="content-iframe" class="content-iframe" src="schedule.html"></iframe>
        </main>
    </div>

    <script src="api_manager.js"></script> 
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const navLinks = document.querySelectorAll('.sidebar-nav .nav-link');
        const iframe = document.querySelector('.content-iframe');

        const schedulesApi = ApiManager('schedules');
        const BASE_SCHEDULE_API_URL = 'https://6852ef850594059b23cfaa4f.mockapi.io/dialysis_base_schedule/1';
        const MEMOS_API_URL = 'https://6852ef850594059b23cfaa4f.mockapi.io/memos';

        function getStartOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(new Date(d.setDate(diff)).setHours(0, 0, 0, 0));
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function systemInitializer() {
            console.log("系統初始化啟動...");
            await preGenerateSchedules();
            await showGlobalMemos();
            console.log("系統初始化完成。");
        }

        async function preGenerateSchedules() {
            console.log("開始檢查並預生成排班...");
            try {
                const baseRes = await fetch(BASE_SCHEDULE_API_URL);
                if (!baseRes.ok) {
                    console.log("未找到常規門診範本，不進行預生成。");
                    return;
                }
                const baseData = await baseRes.json();
                const baseSchedule = baseData.scheduleData;
                if (!baseSchedule || Object.keys(baseSchedule).length === 0) {
                    console.log("常規門診範本為空，不進行預生成。");
                    return;
                }
                
                const thisWeekStart = getStartOfWeek(new Date());
                const nextWeekStart = new Date(thisWeekStart);
                nextWeekStart.setDate(nextWeekStart.getDate() + 7);
                const weeksToProcess = [thisWeekStart, nextWeekStart];
                
                const datesToCheck = [];
                weeksToProcess.forEach(weekStart => {
                    for (let i = 0; i < 6; i++) { // Monday to Saturday
                        const targetDate = new Date(weekStart);
                        targetDate.setDate(weekStart.getDate() + i);
                        datesToCheck.push(formatDate(targetDate));
                    }
                });

                const existingSchedules = await schedulesApi.fetchAll();
                const existingDates = new Set(existingSchedules.map(rec => rec.date));

                const datesToCreate = datesToCheck.filter(date => !existingDates.has(date));

                if (datesToCreate.length === 0) {
                    console.log("本週與下週的排班皆已存在，無需生成。");
                    return;
                }

                console.log(`準備為以下日期生成排班: ${datesToCreate.join(', ')}`);
                
                const scheduleTemplate = {};
                Object.entries(baseSchedule).forEach(([slotId, patientId]) => {
                    const [bed, shiftIndex] = slotId.split('-');
                    const shiftName = Object.keys({ '早': 0, '午': 1, '晚': 2 })[shiftIndex];
                    const dailyShiftId = `bed-${bed}-${shiftName}`;
                    scheduleTemplate[dailyShiftId] = { patientId: patientId };
                });

                for (const dateStr of datesToCreate) {
                    const newRecord = {
                        date: dateStr,
                        schedule: scheduleTemplate,
                        names: {}
                    };
                    await schedulesApi.save(newRecord);
                    console.log(`已成功生成 ${dateStr} 的排班記錄。`);
                }

            } catch (error) {
                console.error("預生成排班時發生錯誤:", error);
            }
        }
        
        async function showGlobalMemos() {
            console.log("正在檢查全域備忘...");
            try {
                const response = await fetch(`${MEMOS_API_URL}?isResolved=false`);
                if (!response.ok) return;
                const memos = await response.json();

                const globalMemos = memos.filter(m => !m.patientName && !m.targetDate);
                
                if (globalMemos.length > 0) {
                    let message = "【全域交班事項提醒】\n\n";
                    globalMemos.forEach(memo => {
                        message += `- ${memo.content}\n`;
                    });
                    setTimeout(() => alert(message), 500);
                }
            } catch (error) {
                console.error("獲取全域備忘時發生錯誤:", error);
            }
        }

        systemInitializer();

        window.navigateTo = function(pageUrl) {
            if (iframe.src !== pageUrl) {
                iframe.src = pageUrl;
            }
            navLinks.forEach(link => {
                const linkPath = new URL(link.href, window.location.origin).pathname;
                const targetPath = new URL(pageUrl, window.location.origin).pathname;
                if (linkPath === targetPath) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        };

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                navLinks.forEach(l => l.classList.remove('active'));
                e.currentTarget.classList.add('active');
            });
        });

        iframe.addEventListener('load', () => {
            const currentIframeSrc = iframe.contentWindow.location.href;
            navLinks.forEach(link => {
                if (link.href === currentIframeSrc) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        });
    });
    </script>
</body>
</html>
