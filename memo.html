<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交班備忘錄</title>
    <style>
        body { font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif; background-color: #f9f9f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .memo-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #eee; }
        .memo-form textarea { padding: 10px; font-size: 1.1em; border-radius: 5px; border: 1px solid #ccc; resize: vertical; min-height: 80px; }
        .memo-options { display: flex; gap: 20px; align-items: center; }
        .memo-options label { font-weight: bold; }
        .memo-options input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .memo-form button { align-self: flex-end; padding: 10px 20px; font-size: 1em; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .memo-form button:hover { background-color: #0056b3; }
        .memo-section { margin-top: 20px; }
        .memo-section h2 { border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .memo-list { list-style: none; padding: 0; }
        .memo-item { background-color: #fff; border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .memo-item.resolved { background-color: #f5f5f5; text-decoration: line-through; color: #888; }
        .memo-content { flex-grow: 1; }
        .memo-content p { margin: 0 0 10px 0; white-space: pre-wrap; }
        .memo-meta { font-size: 0.85em; color: #666; }
        .memo-actions { display: flex; flex-direction: column; gap: 8px; }
        .memo-actions button { padding: 5px 10px; font-size: 0.9em; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        .resolve-btn { background-color: #28a745; color: white; }
        .delete-btn { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>交班備忘錄</h1>
        <div class="memo-form">
            <textarea id="memo-content-input" placeholder="請輸入交班事項或備註..."></textarea>
            <div class="memo-options">
                <label for="memo-patient-input">關聯病人(可選):</label>
                <input type="text" id="memo-patient-input" placeholder="輸入病人姓名">
                <label for="memo-date-input">目標日期(可選):</label>
                <input type="date" id="memo-date-input">
            </div>
            <button id="add-memo-btn">新增備忘</button>
        </div>

        <div class="memo-section">
            <h2>待處理事項</h2>
            <ul id="pending-list" class="memo-list"></ul>
        </div>

        <div class="memo-section">
            <h2>已處理事項 (最近7天)</h2>
            <ul id="resolved-list" class="memo-list"></ul>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const API_URL = 'https://6852ef850594059b23cfaa4f.mockapi.io/memos';

        const contentInput = document.getElementById('memo-content-input');
        const patientInput = document.getElementById('memo-patient-input');
        const dateInput = document.getElementById('memo-date-input');
        const addBtn = document.getElementById('add-memo-btn');
        const pendingList = document.getElementById('pending-list');
        const resolvedList = document.getElementById('resolved-list');

        async function fetchMemos() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('無法獲取備忘錄');
                const memos = await response.json();
                renderMemos(memos);
            } catch (error) {
                console.error(error);
                pendingList.innerHTML = `<li>讀取資料失敗: ${error.message}</li>`;
            }
        }

        function renderMemos(memos) {
            pendingList.innerHTML = '';
            resolvedList.innerHTML = '';

            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

            memos.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            memos.forEach(memo => {
                const li = document.createElement('li');
                li.className = 'memo-item';
                if (memo.isResolved) {
                    li.classList.add('resolved');
                }

                let metaHtml = `<span class="date">建立於: ${new Date(memo.createdAt).toLocaleString()}</span>`;
                if (memo.patientName) metaHtml += ` | <span class="patient">關聯病人: <strong>${memo.patientName}</strong></span>`;
                if (memo.targetDate) metaHtml += ` | <span class="target-date">目標日期: <strong>${memo.targetDate}</strong></span>`;

                li.innerHTML = `
                    <div class="memo-content">
                        <p>${memo.content}</p>
                        <div class="memo-meta">${metaHtml}</div>
                    </div>
                    <div class="memo-actions">
                        ${!memo.isResolved ? `<button class="resolve-btn" data-id="${memo.id}">標為已處理</button>` : ''}
                        <button class="delete-btn" data-id="${memo.id}">永久刪除</button>
                    </div>
                `;

                if (memo.isResolved) {
                    // Only show resolved memos from the last 7 days
                    if (new Date(memo.createdAt) > sevenDaysAgo) {
                         resolvedList.appendChild(li);
                    }
                } else {
                    pendingList.appendChild(li);
                }
            });
        }

        async function addMemo() {
            const content = contentInput.value.trim();
            if (!content) {
                alert('備忘內容不能為空！');
                return;
            }

            const newMemo = {
                content: content,
                patientName: patientInput.value.trim() || null,
                targetDate: dateInput.value || null,
                isResolved: false,
                createdAt: new Date().toISOString()
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newMemo)
                });
                if (!response.ok) throw new Error('新增失敗');
                
                contentInput.value = '';
                patientInput.value = '';
                dateInput.value = '';
                fetchMemos();
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        async function updateMemoStatus(id, isResolved) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isResolved: isResolved })
                });
                if (!response.ok) throw new Error('更新狀態失敗');
                fetchMemos();
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        async function deleteMemo(id) {
            if (!confirm('確定要永久刪除這條備忘嗎？此操作無法復原。')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('刪除失敗');
                fetchMemos();
            } catch (error) {
                console.error(error);
                alert(error.message);
            }
        }

        addBtn.addEventListener('click', addMemo);

        document.querySelector('.container').addEventListener('click', e => {
            const target = e.target;
            const id = target.dataset.id;
            if (!id) return;

            if (target.matches('.resolve-btn')) {
                updateMemoStatus(id, true);
            } else if (target.matches('.delete-btn')) {
                deleteMemo(id);
            }
        });

        fetchMemos();
    });
    </script>
</body>
</html>
